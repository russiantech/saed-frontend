name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: {VITE_API_URL: "https://saed-api.example.com/api"}
      - name: config.js and SPA fallback shipped
        run: test -f build/config.js && test -f build/.htaccess
